[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-ui-backend"
version = "0.1.0"
description = "FastAPI backend for the yt-dlp Web UI (subprocess CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
keywords = ["yt-dlp", "fastapi", "web-ui"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.scripts]
yt-dlp-ui-api = "yt_dlp_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_ui"]

[tool.hatch.build.targets.sdist]
include = [
    "/yt_dlp_ui",
    "/README.md",
    "/pyproject.toml",
]
